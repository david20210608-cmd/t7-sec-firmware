name: Build 360T7 Evil-Twin Sec Firmware (official immortalwrt)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'immortalwrt git ref（分支/tag；默认跟随 25.12 stable 点版本）'
        required: false
        default: 'openwrt-25.12'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  CONFIG_FILE: evil-twin.config
  DIY_P2_SH: diy-part2-sec.sh
  RELEASE_FILE: sec-release.txt
  TZ: Asia/Shanghai
  CCACHE_MAXSIZE: 5G

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Free disk space
      run: |
        # immortalwrt 25.12 全量编译 ~50GB；清掉 runner 预装大件（上一轮 3.5h 后磁盘写死：No space left on device）
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm /usr/share/swift \
          /opt/microsoft /opt/az /usr/local/sqlpackage /usr/share/miniconda || true
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h /

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev ninja-build patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b "${{ github.event.inputs.ref || 'openwrt-25.12' }}" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache toolchain & ccache
      uses: actions/cache@v4
      with:
        # staging_dir/toolchain-* 目录名含 gcc 版本，上游换版本自动失效重建；
        # ccache 目录由 rules.mk 固定为 $(TOPDIR)/.ccache（CONFIG_CCACHE=y）
        path: |
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/.ccache
        key: immortalwrt-tc-ccache-mediatek-filogic-${{ hashFiles('evil-twin.config') }}
        restore-keys: |
          immortalwrt-tc-ccache-mediatek-filogic-
    - name: Update & install feeds
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load configuration
      working-directory: /workdir/openwrt
      run: |
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

    - name: Download packages
      working-directory: /workdir/openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      working-directory: /workdir/openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd /workdir/openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware artifact
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release
      id: tag
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "360T7 evil-twin sec firmware（immortalwrt ${{ github.event.inputs.ref || 'openwrt-25.12' }}）"
          echo ""
          cat $GITHUB_WORKSPACE/$RELEASE_FILE
        } > release-body.md

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.release_tag && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release-body.md
        files: ${{ env.FIRMWARE }}/*
